name: Verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gacha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gacha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build production image
        run: docker build -t terre-des-noobs:ci .
      - name: Verify gacha Canvas and catalog in production image without external APIs
        run: >-
          docker run --rm terre-des-noobs:ci node --input-type=module -e
          "import {createGachaPreviewGame} from './scripts/preview-gacha.js';
          import {renderGacha} from './src/gacha-ui.js';
          import {gachaCommands} from './src/gacha-controller.js';
          import {CATALOG} from './src/gacha-catalog.js';
          const game = await createGachaPreviewGame();
          if (gachaCommands.length !== 7 || CATALOG.cards.length < 4000) process.exit(1);
          for (const view of ['profile','packs','collection','market','social','info','missions','albums']) {
          const panel = await renderGacha(await game.execute('view','111111111111111111',{view}),'111111111111111111');
          if (!panel.files[0].attachment.length || panel.components.length > 5) process.exit(1);
          console.log(view, panel.files[0].attachment.length, 'bytes'); }
          const pull = await renderGacha(await game.execute('open','111111111111111111',{pack:'mix',count:5}),'111111111111111111');
          if (pull.files[0].attachment.length > 8000000) process.exit(1);
          console.log('25 character portraits:',pull.files[0].attachment.length,'bytes');"
      - name: Verify mythic and legendary GIF workers in production image
        run: >-
          docker run --rm terre-des-noobs:ci node --input-type=module -e
          "import {createGachaPreviewGame} from './scripts/preview-gacha.js';
          import {renderGacha} from './src/gacha-ui.js';
          import {CATALOG} from './src/gacha-catalog.js';
          const game=await createGachaPreviewGame();
          const data=await game.execute('open','111111111111111111',{pack:'mix'});
          for(const rarity of [4,5]) {
          const card=CATALOG.cards.find(c=>c.rarity===rarity);
          const d={...data,pulls:data.pulls.map((p,i)=>i===2?{cardId:card.id,fresh:true}:p)};
          const panel=await renderGacha(d,'111111111111111111');
          const f=panel.files[0];
          if(!f.name.endsWith('.gif')||f.attachment.toString('ascii',0,6)!=='GIF89a'||f.attachment.length>8000000)process.exit(1);
          console.log(rarity,f.name,f.attachment.length,'bytes');}"
