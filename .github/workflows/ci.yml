name: Verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rpg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rpg_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build production image
        run: docker build -t terre-des-noobs:ci .
      - name: Verify Canvas in production image
        run: >-
          docker run --rm terre-des-noobs:ci node --input-type=module -e
          "import {render} from './src/views.js';
          import {createCustomizedPreviewGame} from './scripts/preview.js';
          import {resolveRoute} from './src/controller.js';
          const game = await createCustomizedPreviewGame();
          await game.execute('chooseSpecialization','demo',{specId:'mage_2'});
          await game.execute('equipHonor','demo',{slot:'frame',honorId:'chasseur'});
          for (const action of ['profile','customize','social','market','info','publicProfile','publicMarket','inventory','identity','specializations','honors']) {
          const panel = await render(await resolveRoute(game,{action},'demo'),'demo');
          if (!panel.files[0].attachment.length) process.exit(1);
          console.log(action, 'Canvas PNG:', panel.files[0].attachment.length, 'bytes'); }
          await game.execute('travel','demo',{zoneId:2});
          await game.execute('explore','demo');
          const battle = await render(await resolveRoute(game,{action:'campaign'},'demo'),'demo');
          if (!battle.files[0].attachment.length) process.exit(1);
          console.log('Enemy portrait PNG:', battle.files[0].attachment.length, 'bytes');"
      - name: Verify campaign map and encounter menus in production image
        run: >-
          docker run --rm terre-des-noobs:ci node --input-type=module -e
          "import {render} from './src/views.js';
          import {createCampaignPreviewGame} from './scripts/preview.js';
          import {resolveRoute} from './src/controller.js';
          const game = await createCampaignPreviewGame();
          for (const action of ['map','encounters']) {
          const panel = await render(await resolveRoute(game,{action},'demo'),'demo');
          if (!panel.files[0].attachment.length) process.exit(1);
          console.log(action, 'Canvas PNG:', panel.files[0].attachment.length, 'bytes'); }"
