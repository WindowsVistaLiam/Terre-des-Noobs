services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: terre_des_noobs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terre_des_noobs"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
